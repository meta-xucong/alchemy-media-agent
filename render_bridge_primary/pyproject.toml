[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alchemy-render-bridge-primary"
version = "0.1.0"
description = "Product-neutral durable Render Bridge HTTP transport"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27", "Pillow>=10"]

[tool.setuptools]
packages = ["render_bridge_primary"]
package-dir = {render_bridge_primary = "."}
