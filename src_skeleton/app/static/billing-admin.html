<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Veyra Billing Admin</title>
    <link rel="stylesheet" href="/static/styles.css?v=__STATIC_STYLES_VERSION__" />
    <link rel="stylesheet" href="/static/api-access.css?v=__API_ACCESS_CSS_VERSION__" />
  </head>
  <body>
    <div class="app-shell billing-admin-shell">
      <header class="lux-header">
        <a id="brandHomeLink" class="brand-lockup brand-home-link" href="https://aiself.vip/" aria-label="返回 Veyra Agent 总导航">
          <div class="brand-mark" aria-hidden="true">A</div>
          <div>
            <p class="eyebrow">Veyra Agent</p>
            <h1>Billing Admin</h1>
          </div>
        </a>
        <div class="module-tabs billing-admin-title" aria-label="管理模块">
          <button class="tab active" type="button">Alchemy 计费参数</button>
        </div>
        <div class="header-status">
          <a class="surface-switch-link" href="/">返回 Alchemy</a>
          <span id="adminState" class="state-pill">检查中</span>
        </div>
      </header>

      <main class="homepage billing-admin-page">
        <section class="panel flow-section billing-console-panel">
          <div class="panel-head section-title">
            <div>
              <p class="eyebrow">Sub2API Balance</p>
              <h3>生图计费控制台</h3>
            </div>
            <div class="v2-status-actions">
              <span id="billingConsoleState" class="state-pill">未加载</span>
              <button id="billingRefreshBtn" class="button secondary" type="button">刷新设置</button>
            </div>
          </div>

          <form id="billingSettingsForm" class="billing-rule-list" aria-live="polite">
            <div id="billingRulesGrid" class="billing-rules-grid"></div>
            <div class="billing-actions">
              <button id="billingSaveBtn" class="button primary" type="submit">保存全部设置</button>
              <span id="billingSettingsHint" class="micro-copy">只有 sub2api 管理员可以修改。</span>
            </div>
          </form>
        </section>

        <section class="panel flow-section" aria-label="API 管理">
          <div class="panel-head section-title"><div><p class="eyebrow">API Access</p><h3>API 密钥管理</h3></div><a class="button secondary" href="/admin/api-access">查看与管理密钥</a></div>
          <div id="apiAdminOverview" aria-live="polite">正在读取密钥概览…</div>
        </section>

        <section class="panel flow-section retention-console-panel">
          <div class="panel-head section-title">
            <div>
              <p class="eyebrow">Storage Maintenance</p>
              <h3>数据自动清理</h3>
            </div>
            <span id="retentionConsoleState" class="state-pill">未加载</span>
          </div>

          <form id="retentionSettingsForm" class="retention-settings-form" aria-live="polite">
            <label class="billing-toggle-row">
              <input id="retentionProtectedData" type="checkbox" />
              <span>同时清理成功生成的图片、用户历史、项目记录、上传素材、活动任务和未知 MCP 任务</span>
            </label>
            <label class="field">
              <span>保留天数</span>
              <input id="retentionDays" type="number" min="1" max="3650" step="1" value="30" required />
              <small class="micro-copy">默认 30 天；现有失败任务和缓存规则保持不变。</small>
            </label>
            <div class="billing-actions">
              <button id="retentionSaveBtn" class="button primary" type="submit">保存清理设置</button>
              <span id="retentionSettingsHint" class="micro-copy">只有管理员可以修改。</span>
            </div>
          </form>
        </section>
      </main>
    </div>

    <div id="globalToast" class="global-toast" role="status" aria-live="polite" hidden></div>
    <script src="/static/billing-admin.js?v=__STATIC_BILLING_ADMIN_VERSION__" defer></script>
    <script src="/static/api-access.js?v=__API_ACCESS_JS_VERSION__" defer></script>
  </body>
</html>
