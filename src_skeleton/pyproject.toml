[project]
name = "custom-media-agent"
version = "0.1.0"
description = "Custom image/video generation agent platform skeleton"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]==0.52.1",
  "pydantic==2.13.4",
  "openai==2.53.0",
  "openai-agents==0.20.0",
  "mcp==2.0.0",
  "python-dotenv==1.2.2",
  "httpx==0.28.1",
  "httpcore==1.0.9",
  "Pillow==12.3.0",
  "qrcode==8.2",
  "opencv-python-headless==4.14.0.94",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "PyYAML>=6.0",
]
