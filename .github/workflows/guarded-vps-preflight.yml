name: Guarded VPS Preflight

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "Exact origin/main commit that must be available on the VPS"
        required: true
        type: string

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout expected commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 1

      - name: Prepare SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_KEY_B64: ${{ secrets.VPS_SSH_KEY_B64 }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "${VPS_SSH_KEY_B64:-${VPS_SSH_KEY:-}}"
          mkdir -p ~/.ssh
          if test -n "${VPS_SSH_KEY_B64:-}"; then
            printf '%s' "$VPS_SSH_KEY_B64" | base64 -d > ~/.ssh/id_ed25519
          else
            printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          fi
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null

      - name: Verify release topology and target availability
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          remote="${VPS_USER:-root}@${VPS_HOST}"
          ssh -i ~/.ssh/id_ed25519 -p "$VPS_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=accept-new \
            "$remote" "bash -s -- '$EXPECTED_SHA'" <<'REMOTE_SCRIPT'
          set -euo pipefail

          expected_sha="$1"
          deploy_link="/opt/alchemy-media-agent"
          v1_container="alchemy-media-agent"
          v2_units=(alchemy-v2-api.service alchemy-v2-worker.service alchemy-v2-sync-worker.service)

          stop() {
            printf 'GUARDED_PREFLIGHT_STOP=%s\n' "$1" >&2
            exit 1
          }

          read_mount() {
            local destination="$1"
            local raw value
            raw="$(docker inspect "$v1_container" --format '{{range .Mounts}}{{if eq .Destination "'"$destination"'"}}{{printf "%s|" .Source}}{{end}}{{end}}' 2>/dev/null)" || return 1
            value="${raw%|}"
            [ -n "$value" ] && [ "$value" != *'|'* ] || return 1
            printf '%s' "$value"
          }

          require_v2() {
            local unit
            for unit in "${v2_units[@]}"; do
              systemctl is-active --quiet "$unit" || return 1
            done
          }

          [ -L "$deploy_link" ] || stop deployment_link_missing
          active_release="$(realpath "$deploy_link")"
          [ -e "$active_release/.git" ] || stop active_release_not_git_worktree
          git -C "$active_release" diff --quiet || stop active_release_tracked_changes
          [ "$(docker inspect "$v1_container" --format '{{.State.Running}}' 2>/dev/null)" = true ] || stop v1_not_running
          live_env="$(read_mount /app/.env)" || stop v1_env_mount_ambiguous
          v1_media="$(read_mount /app/.media_storage)" || stop v1_media_mount_ambiguous
          v2_storage="$(read_mount /var/lib/alchemy/v2/storage)" || stop v2_storage_mount_ambiguous
          [ -f "$live_env" ] || stop live_env_missing
          [ -d "$v1_media" ] || stop v1_media_missing
          [ -d "$v2_storage" ] || stop v2_storage_missing
          require_v2 || stop v2_units_not_active
          git -C "$active_release" fetch --prune origin >/dev/null
          [ "$(git -C "$active_release" rev-parse origin/main)" = "$expected_sha" ] || stop origin_main_target_mismatch
          [ "$(git -C "$active_release" cat-file -t "${expected_sha}^{commit}")" = commit ] || stop target_commit_unavailable
          git -C "$active_release" diff --quiet || stop active_release_changed_after_fetch
          printf 'GUARDED_PREFLIGHT_RESULT=pass\n'
          printf 'GUARDED_PREFLIGHT_TARGET_SHA=%s\n' "$expected_sha"
          printf 'GUARDED_PREFLIGHT_ACTIVE_RELEASE=%s\n' "$active_release"
          printf 'GUARDED_PREFLIGHT_ACTIVE_SHA=%s\n' "$(git -C "$active_release" rev-parse HEAD)"
          printf 'GUARDED_PREFLIGHT_V1_ENV=%s\n' "$live_env"
          printf 'GUARDED_PREFLIGHT_V1_MEDIA=%s\n' "$v1_media"
          printf 'GUARDED_PREFLIGHT_V2_STORAGE=%s\n' "$v2_storage"
          printf 'GUARDED_PREFLIGHT_V2_UNITS=all_active\n'

          # Read-only capacity evidence for guarded cutover planning. Never run
          # prune/cleanup commands from this preflight.
          printf 'GUARDED_PREFLIGHT_DISK_CAPACITY_BEGIN=1\n'
          for path in / /var/lib/alchemy /var/lib/docker /opt /var/backups/alchemy "$v1_media" "$v2_storage"; do
            [ -e "$path" ] || continue
            df -PB1 "$path" | awk -v path="$path" 'NR == 2 {printf "GUARDED_PREFLIGHT_DISK path=%s size_bytes=%s used_bytes=%s available_bytes=%s mount=%s\n", path, $2, $3, $4, $6}'
          done
          printf 'GUARDED_PREFLIGHT_RELEASE_SIZES_BEGIN=1\n'
          if [ -d /opt/alchemy-media-agent-releases ]; then
            find /opt/alchemy-media-agent-releases -mindepth 1 -maxdepth 1 -type d -name 'doc276-277-*' -print0 \
              | xargs -0 -r du -sb -- | sort -n | tail -n 30 \
              | awk '{path=$2; sub("^/opt/alchemy-media-agent-releases/", "", path); printf "GUARDED_PREFLIGHT_RELEASE_BYTES name=%s bytes=%s\n", path, $1}'
          fi
          printf 'GUARDED_PREFLIGHT_BACKUP_SIZES_BEGIN=1\n'
          if [ -d /var/backups/alchemy ]; then
            find /var/backups/alchemy -mindepth 1 -maxdepth 1 -type d -name 'pr29-*' -print0 \
              | xargs -0 -r du -sb -- | sort -n \
              | awk '{printf "GUARDED_PREFLIGHT_BACKUP_BYTES name=%s bytes=%s\n", $2, $1}'
          fi
          printf 'GUARDED_PREFLIGHT_DOCKER_USAGE_BEGIN=1\n'
          docker system df --format 'GUARDED_PREFLIGHT_DOCKER type={{.Type}} total={{.TotalCount}} size={{.Size}} reclaimable={{.Reclaimable}}'
          docker image ls --filter 'reference=alchemy-media-agent:*' \
            --format 'GUARDED_PREFLIGHT_ALCHEMY_IMAGE tag={{.Tag}} size={{.Size}} created={{.CreatedAt}}'
          docker ps -a --format 'GUARDED_PREFLIGHT_CONTAINER name={{.Names}} image={{.Image}} status={{.Status}}'
          printf 'GUARDED_PREFLIGHT_CUTOVER_ESTIMATE_BEGIN=1\n'
          read_v2_env_value() {
            local key="$1" count
            [ -f /etc/alchemy/alchemy-v2.env ] || return 1
            count="$(awk -F= -v key="$key" '$1 == key {count++} END {print count+0}' /etc/alchemy/alchemy-v2.env)"
            [ "$count" -le 1 ] || return 1
            awk -F= -v key="$key" '$1 == key {sub(/^[^=]*=/, ""); sub(/\r$/, ""); print; exit}' /etc/alchemy/alchemy-v2.env
          }
          estimate_status="available"
          if ! v2_data="$(read_v2_env_value V2_DATA_DIR)" \
            || ! v2_history_path="$(read_v2_env_value V2_IMAGE_HISTORY_PATH)"; then
            estimate_status="v2_storage_configuration_unavailable"
          else
            v2_data="${v2_data:-$v2_storage}"
            v2_history_path="${v2_history_path:-$v2_data/image_history.jsonl}"
            v2_history_dir="$(dirname "$v2_history_path")"
            guard_script="$active_release/scripts/vps_cutover_guard.py"
            if [ ! -d "$v2_data" ] || [ ! -d "$v2_history_dir" ]; then
              estimate_status="v2_data_root_unavailable"
            elif bridge_paths="$(python3 "$guard_script" verify-bridge-storage-configuration \
              --v1-environment "$active_release/src_skeleton/.env" \
              --v2-environment /etc/alchemy/alchemy-v2.env \
              --release-root "$active_release")"; then
              bridge_control="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["control_path"])' <<<"$bridge_paths")"
              bridge_state="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["state_root"])' <<<"$bridge_paths")"
              estimate_inventory="$(mktemp)"
              if for root in "$v1_media" "$v2_data" "$v2_history_dir" "$bridge_state"; do
                [ -d "$root" ] || exit 1
                find "$root" -type f \( -name '*.sqlite3' -o -name '*.sqlite' -o -name '*.db' \) -print0 || exit 1
              done | sort -zu > "$estimate_inventory"; then
                estimate_sources=(--source "$v1_media/history/outputs.jsonl"
                  --source "$v1_media/favorites/image_favorites.json"
                  --source "$v2_history_path" --source "$v2_data/image_favorites.json"
                  --source "$bridge_control")
                if [ -d "$v2_data/render_bridge_primary" ]; then
                  while IFS= read -r -d '' path; do estimate_sources+=(--source "$path"); done \
                    < <(find "$v2_data/render_bridge_primary" -type f -name '*.json' -print0)
                fi
                if estimate_json="$(python3 "$guard_script" estimate-space \
                  --inventory-file "$estimate_inventory" --reserve-bytes 1073741824 "${estimate_sources[@]}")"; then
                  python3 -c 'import json,sys; d=json.load(sys.stdin); print("GUARDED_PREFLIGHT_CUTOVER_ESTIMATE reserve_bytes={reserve_bytes} backup_bytes={backup_bytes} index_growth_bytes={index_growth_bytes} restore_temporary_bytes={restore_temporary_bytes} verification_scratch_bytes={verification_scratch_bytes} required_data_bytes={required_data_bytes} required_backup_bytes={required_backup_bytes}".format(**d))' <<<"$estimate_json"
                else
                  estimate_status="space_estimate_inputs_unavailable"
                fi
              else
                estimate_status="database_inventory_unavailable"
              fi
              rm -f -- "$estimate_inventory"
            else
              estimate_status="bridge_storage_configuration_unavailable"
            fi
          fi
          if [ "$estimate_status" != available ]; then
            printf 'GUARDED_PREFLIGHT_CUTOVER_ESTIMATE_STATUS=%s\n' "$estimate_status"
          fi
          printf 'GUARDED_PREFLIGHT_DISK_CAPACITY_END=1\n'
          REMOTE_SCRIPT
