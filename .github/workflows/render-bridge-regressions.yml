name: Render Bridge mock regressions

on:
  push:
    branches: ["feature/render-bridge-preview"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-bridge-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: .:src_skeleton
  PYTHON_DOTENV_DISABLED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  ORT_DISABLE_TELEMETRY: "1"
  OPENAI_AGENTS_DISABLE_TRACING: "1"
  MEDIA_AGENT_MODE: mock
  MOCK_IMAGE_PROVIDER_ENABLED: "true"
  DEFAULT_IMAGE_PROVIDER: mock_image
  DEFAULT_IMAGE_MODEL: mock-image-v1
  MEDIA_AGENT_PERSIST_RUNTIME_SETTINGS: "false"
  V3_LLM_BRAIN_REMOTE_ENABLED: "false"
  LLM_PROMPT_PLANNING_ENABLED: "false"
  LAB_LLM_ENABLED: "false"
  LAB_VISION_ENABLED: "false"
  GEMINI_IMAGE_GENERATION_ENABLED: "false"
  VEYRA_AUTH_ENABLED: "false"
  VEYRA_REQUIRE_UI_AUTH: "false"
  ALCHEMY_RENDER_BRIDGE_MODE: disabled
  ALCHEMY_RENDER_BRIDGE_NATIVE_ENABLED: "false"
  ALCHEMY_RENDER_BRIDGE_NATIVE_PROFILES: fake-image
  ALCHEMY_V3_LOCAL_RUNTIME_DISCOVERY_ENABLED: "false"
  CODEX_AUTH_FILE: /tmp/render-bridge-ci/no-codex-auth.json
  CLAUDE_SETTINGS_FILE: /tmp/render-bridge-ci/no-claude-settings.json
  OPENAI_API_KEY: ""
  ANTHROPIC_API_KEY: ""
  ANTHROPIC_AUTH_TOKEN: ""
  GEMINI_API_KEY: ""
  GEMINI_IMAGE_API_KEY: ""
  GOOGLE_API_KEY: ""
  LLM_GATEWAY_API_KEY: ""
  DEEPSEEK_LLM_API_KEY: ""
  DOUBAO_IMAGE_API_KEY: ""
  BYTEPLUS_API_KEY: ""
  LAB_OPENAI_API_KEY: ""
  LAB_KIMI_API_KEY: ""
  LAB_DOUBAO_VISION_API_KEY: ""
  V2_OPENAI_API_KEY: ""
  V2_DOUBAO_IMAGE_API_KEY: ""
  V2_DOUBAO_VISION_API_KEY: ""
  V2_CLAUDE_ORCHESTRATOR_FALLBACK_AUTH_TOKEN: ""
  ALCHEMY_DOC270_ECOMMERCE_SOURCE_ANALYSIS_API_KEY: ""
  ALCHEMY_RENDER_BRIDGE_TOKEN: ""
  ALCHEMY_RENDER_BRIDGE_URL: ""
  ALCHEMY_RENDER_BRIDGE_WORKSPACE: ""
  # The two jobs use separate ephemeral GitHub-hosted runners.
  MEDIA_STORAGE_ROOT: /tmp/render-bridge-ci/v1
  VEYRA_USAGE_PATH: /tmp/render-bridge-ci/v1/usage.jsonl
  ALCHEMY_V3_JOB_DIR: /tmp/render-bridge-ci/v3/jobs
  ALCHEMY_V3_PROJECT_DIR: /tmp/render-bridge-ci/v3/projects
  ALCHEMY_V3_OUTPUT_DIR: /tmp/render-bridge-ci/v3/outputs
  ALCHEMY_V3_UPLOAD_DIR: /tmp/render-bridge-ci/v3/uploads
  V3_VISUAL_ASSET_CATALOG_ROOT: /tmp/render-bridge-ci/v3/visual-assets
  V3_VISUAL_ASSET_LIBRARY_ROOT: /tmp/render-bridge-ci/v3/asset-library
  ALCHEMY_V3_MCP_MATERIALIZATION_ROOT: /tmp/render-bridge-ci/v3/materializations
  ALCHEMY_RENDER_BRIDGE_STORAGE: /tmp/render-bridge-ci/bridge

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned contract dependencies
        run: python -m pip install -r src_skeleton/requirements.txt pytest==8.3.3
      - name: Verify Bridge contracts and narrow original-path regressions
        # The glob includes native/profile-options/diagnostics and legacy identities.
        # Browser tests live in tests/browser/, outside this top-level glob.
        run: |
          mkdir -p "$RUNNER_TEMP/render-bridge-home" /tmp/render-bridge-ci
          HOME="$RUNNER_TEMP/render-bridge-home" python -m pytest -q \
            tests/test_render_bridge_*.py \
            tests/test_api_smoke.py::test_http_smoke_image_revision_and_providers \
            alchemy_creative_agent_3_0/tests/test_v3_product_api_minimal_ux.py \
            alchemy_creative_agent_3_0/tests/test_v3_scenario_runtime_and_product_api.py \
            alchemy_creative_agent_3_0/tests/test_v3_generic_export_review_gate.py \
            --junitxml="$RUNNER_TEMP/render-bridge-contracts.xml"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: render-bridge-contracts-${{ github.sha }}
          path: ${{ runner.temp }}/render-bridge-contracts.xml
          if-no-files-found: warn

  preview-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned browser fixture dependencies
        run: python -m pip install pytest==8.3.3 Pillow==12.3.0 playwright==1.62.0
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Verify shipped preview UI with synthetic intercepted API only
        run: >-
          BRIDGE_UI_SCREENSHOT_DIR=${{ runner.temp }}/render-bridge-admin-screenshots
          python -m pytest -q tests/browser/test_render_bridge_preview_ui.py tests/browser/test_render_bridge_admin_ui.py
          --junitxml=${{ runner.temp }}/render-bridge-browser.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: render-bridge-browser-${{ github.sha }}
          path: |
            ${{ runner.temp }}/render-bridge-browser.xml
            ${{ runner.temp }}/render-bridge-admin-screenshots/*.png
          if-no-files-found: warn
