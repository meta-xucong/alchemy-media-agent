name: Guarded VPS Project Audit

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "Exact active VPS release commit to audit"
        required: true
        type: string
      project_id:
        description: "Server project identifier to inspect read-only"
        required: true
        type: string
      planning_operation_id:
        description: "Optional exact planning operation ID for safe failure diagnostics"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  project-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout expected commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 1

      - name: Prepare SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_KEY_B64: ${{ secrets.VPS_SSH_KEY_B64 }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "${VPS_SSH_KEY_B64:-${VPS_SSH_KEY:-}}"
          mkdir -p ~/.ssh
          if test -n "${VPS_SSH_KEY_B64:-}"; then
            printf '%s' "$VPS_SSH_KEY_B64" | base64 -d > ~/.ssh/id_ed25519
          else
            printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          fi
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null

      - name: Read latest generation, review and frontend requests
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          remote="${VPS_USER:-root}@${VPS_HOST}"
          ssh -i ~/.ssh/id_ed25519 -p "$VPS_PORT" -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
            "$remote" "bash -s -- '$EXPECTED_SHA'" <<'REMOTE'
          set -euo pipefail
          active="$(realpath /opt/alchemy-media-agent)"
          [ "$(git -C "$active" rev-parse HEAD)" = "$1" ]
          [ "$(docker inspect alchemy-media-agent --format '{{.State.Running}}')" = true ]
          [ "$(docker inspect alchemy-media-agent --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$1" ]
          "$active/custom_media_agent_2_0/.venv/bin/python" - "$active" <<'PY'
          """Read-only latest V2 generation/review/frontend-request snapshot."""
          import base64
          import json
          import os
          import re
          import sqlite3
          import subprocess
          import sys
          import time
          from datetime import datetime, timezone
          from pathlib import Path
          from PIL import Image
          from cryptography.hazmat.primitives import hashes, serialization
          from cryptography.hazmat.primitives.asymmetric import padding
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM

          release = Path(sys.argv[1]).resolve()
          configured = {}
          for line in Path('/etc/alchemy/alchemy-v2.env').read_text(encoding='utf-8').splitlines():
              key, sep, value = line.strip().removeprefix('export ').partition('=')
              if sep and not key.startswith('#'):
                  configured[key] = value.strip().strip('"').strip("'")
          data_root = Path(configured['V2_DATA_DIR']).resolve()
          storage_root = Path(configured['V2_STORAGE_DIR']).resolve()

          def readonly(path):
              connection = sqlite3.connect(path.resolve().as_uri() + '?mode=ro', uri=True, timeout=2)
              connection.execute('PRAGMA query_only=ON')
              return connection

          db = readonly(data_root / 'repository.sqlite3')
          def records(namespace, limit=8):
              return [json.loads(row[0]) for row in db.execute(
                  "SELECT payload FROM v2_records WHERE namespace=? ORDER BY json_extract(payload,'$.updated_at') DESC LIMIT ?",
                  (namespace, limit))]

          runs = records('creative_runs')
          jobs = records('image_jobs', 12)
          run_by_id = {item['run_id']: item for item in runs}
          job_by_run = {}
          for job in jobs:
              job_by_run.setdefault(job.get('run_id'), []).append(job)
          outputs = {}
          for row in db.execute("SELECT record_key,payload FROM v2_records WHERE namespace='outputs' ORDER BY rowid DESC LIMIT 24"):
              outputs[row[0]] = json.loads(row[1])
          db.close()

          summaries = []
          for run in runs:
              runid = run['run_id']
              linked = job_by_run.get(runid, [])
              events = [{key: event.get(key) for key in ('stage', 'status', 'outcome', 'started_at', 'completed_at', 'elapsed_ms', 'duration_ms', 'provider', 'model') if key in event}
                  for event in (run.get('progress_events') or [])[-30:] if isinstance(event, dict)]
              jobs_for_run = []
              for job in linked:
                  item = {'job_id': job.get('job_id'), 'status': job.get('status'), 'provider': job.get('provider_id'),
                          'model': job.get('model'), 'created_at': job.get('created_at'), 'updated_at': job.get('updated_at'),
                          'outputs': []}
                  try:
                      item['elapsed_seconds'] = round((datetime.fromisoformat(job['updated_at'].replace('Z', '+00:00')) -
                                                         datetime.fromisoformat(job['created_at'].replace('Z', '+00:00'))).total_seconds(), 3)
                  except (TypeError, KeyError, ValueError):
                      item['elapsed_seconds'] = None
                  for ref in job.get('outputs', []):
                      outputid = ref.get('output_id')
                      canonical = outputs.get(outputid) or {}
                      review = canonical.get('review') or ref.get('review') or {}
                      metadata = ref.get('metadata') or canonical.get('metadata') or {}
                      bridge = metadata.get('render_bridge_primary') or {}
                      attempts = review.get('model_attempts') or []
                      out = {'output_id': outputid, 'review': {key: review.get(key) for key in
                          ('analysis_mode', 'decision', 'model', 'elapsed_ms', 'failure_code')},
                          'model_attempts': [{key: attempt.get(key) for key in ('model', 'outcome', 'failure_class', 'elapsed_ms')}
                                             for attempt in attempts],
                          'note_count': len(review.get('notes') or []), 'reason_count': len(review.get('revision_directives') or []),
                          'bridge': {key: bridge.get(key) for key in ('route', 'state', 'reason', 'task_id', 'receipt_id', 'attempt_id') if key in bridge},
                          'files': []}
                      for role, field in (('original', 'storage_path'), ('preview', 'preview_path'), ('thumbnail', 'thumbnail_path')):
                          path = Path(str(metadata.get(field) or '')).resolve()
                          check = {'role': role, 'exists': path.is_relative_to(storage_root) and path.is_file()}
                          if check['exists']:
                              check['bytes'] = path.stat().st_size
                              try:
                                  with Image.open(path) as image:
                                      check.update(width=image.width, height=image.height, format=image.format)
                                      image.verify()
                                  check['valid'] = True
                              except Exception as error:
                                  check.update(valid=False, error_type=type(error).__name__)
                          out['files'].append(check)
                      item['outputs'].append(out)
                  jobs_for_run.append(item)
              summaries.append({'run_id': runid, 'status': run.get('status'), 'mode': run.get('mode'),
                  'created_at': run.get('created_at'), 'updated_at': run.get('updated_at'), 'progress_summary':
                  {key: (run.get('progress_summary') or {}).get(key) for key in ('status', 'stage', 'completed', 'total', 'updated_at')},
                  'events': events, 'jobs': jobs_for_run})

          queue_path = Path(configured.get('V2_TASK_QUEUE_DB_PATH') or data_root / 'task_queue.sqlite3')
          queue = readonly(queue_path)
          queue_rows = [{'task_id': row[0], 'kind': row[1], 'run_id': row[2], 'status': row[3], 'attempts': row[4],
                         'created_at': row[5], 'updated_at': row[6], 'claim_generation': row[7]}
                        for row in queue.execute("SELECT task_id,kind,run_id,status,attempts,created_at,updated_at,claim_generation "
                                                 "FROM v2_tasks ORDER BY created_at DESC LIMIT 12")]
          queue.close()

          tracked_ids = set()
          for run in summaries:
              tracked_ids.add(run['run_id'])
              for job in run['jobs']:
                  tracked_ids.add(job['job_id'])
                  tracked_ids.update(output['output_id'] for output in job['outputs'] if output['output_id'])
          pattern = re.compile(r'"(GET|POST) ([A-Za-z0-9_/?=&%-]+) HTTP/[0-9.]+" ([1-5][0-9]{2})')
          logs = []
          for unit in ('alchemy-v2-api.service', 'alchemy-v2-worker.service'):
              try:
                  raw = subprocess.run(['journalctl', '-u', unit, '--since', '90 minutes ago', '--no-pager', '-o', 'short-iso-precise'],
                                       capture_output=True, timeout=22, check=True).stdout.decode('utf-8', errors='replace')
              except Exception as error:
                  logs.append({'unit': unit, 'read_error_type': type(error).__name__})
                  continue
              requests = []
              for line in raw.splitlines():
                  match = pattern.search(line)
                  if not match:
                      continue
                  method, path, status = match.groups()
                  path_only = path.split('?', 1)[0]
                  if any(identity in path_only for identity in tracked_ids):
                      requests.append({'at': line.split(' ', 1)[0], 'method': method, 'path': path_only, 'status': int(status)})
              logs.append({'unit': unit, 'matched_requests': requests[-60:]})

          effective = json.loads((data_root / 'runtime_model_settings.json').read_text(encoding='utf-8'))
          config_snapshot = {key: effective.get(key) for key in ('default_agent_model', 'output_review_agent_model',
              'claude_orchestrator_model', 'claude_orchestrator_multimodal_model', 'claude_orchestrator_fallback_models',
              'claude_orchestrator_fallback_model')}
          secret_data = {'runs': runs[:6], 'jobs': jobs[:12], 'queue': queue_rows, 'runtime': config_snapshot}
          public_key = serialization.load_pem_public_key('-----BEGIN PUBLIC KEY-----\nMIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAsJXjfMfxb9o14TlHzgHa\nb7yx4eE61GiARUZHpGvKlW2STr3Ht2vm5xqxpj6nx7V0n0n9HkiKVqMUGHcjyfb3\nu670qeQVWqcnTOeG76g1IL+PWUhTgYTqeJIqPc7jJafQaTp0yJnlEMMXAinp4STr\nnoLKPT2YOR2GWKoVa90LVdSs53GUOTr2Hh4t9f3uNOr+F4z6lQK9qvb0Ap0wRrad\n2fzGIXZyQuQR/TyGuy9FKAhBp5mTSPaPkapbgEKcQa0gPFmwduQ9CKdVh6j78Tm5\nWiHrIsK6K0i90EoRnsjDiWHFYIVm0qFuxQHiOKco9LbgwMc0P9JL2+58ChUffCvX\n9QIDAQAB\n-----END PUBLIC KEY-----\n'.encode())
          key, nonce = os.urandom(32), os.urandom(12)
          sealed = AESGCM(key).encrypt(nonce, json.dumps(secret_data, ensure_ascii=False).encode(), None)
          wrapped = public_key.encrypt(key, padding.OAEP(mgf=padding.MGF1(algorithm=hashes.SHA256()), algorithm=hashes.SHA256(), label=None))
          result = {'checked_at': datetime.now(timezone.utc).isoformat(), 'active_sha': subprocess.check_output(
              ['git', '-C', str(release), 'rev-parse', 'HEAD'], text=True).strip(),
              'runs': summaries, 'queue': queue_rows, 'runtime_model_settings': config_snapshot, 'frontend_requests': logs}
          print('PRIVATE_RUN_STATE=' + json.dumps({key: base64.b64encode(value).decode() for key, value in
              {'key': wrapped, 'nonce': nonce, 'cipher': sealed}.items()}))
          print('V2_RUN_MONITOR=' + json.dumps(result, ensure_ascii=False, separators=(',', ':')), flush=True)
          PY
          REMOTE
