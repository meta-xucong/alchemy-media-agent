name: Guarded VPS Project Audit

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "Exact active VPS release commit to audit"
        required: true
        type: string
      project_id:
        description: "Server project identifier to inspect read-only"
        required: true
        type: string
      planning_operation_id:
        description: "Optional exact planning operation ID for safe failure diagnostics"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  project-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout expected commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 1

      - name: Prepare SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_KEY_B64: ${{ secrets.VPS_SSH_KEY_B64 }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "${VPS_SSH_KEY_B64:-${VPS_SSH_KEY:-}}"
          mkdir -p ~/.ssh
          if test -n "${VPS_SSH_KEY_B64:-}"; then
            printf '%s' "$VPS_SSH_KEY_B64" | base64 -d > ~/.ssh/id_ed25519
          else
            printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          fi
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null

      - name: Read exact stopped build container metadata
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          remote="${VPS_USER:-root}@${VPS_HOST}"
          ssh -i ~/.ssh/id_ed25519 -p "$VPS_PORT" -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
            "$remote" "python3 - '$EXPECTED_SHA'" <<'PY'
          import json, subprocess, sys
          from pathlib import Path
          def cmd(*args):
              return subprocess.check_output(args, text=True)
          active = Path('/opt/alchemy-media-agent').resolve()
          assert cmd('git', '-C', str(active), 'rev-parse', 'HEAD').strip() == sys.argv[1]
          row = json.loads(cmd('docker', 'container', 'inspect', '--size', 'goofy_cannon'))[0]
          config = row.get('Config', {})
          print(json.dumps({'container': row['Id'], 'name': row['Name'], 'created': row['Created'],
              'state': {k: row['State'][k] for k in ['Status','Running','ExitCode','StartedAt','FinishedAt']},
              'size_rw': row.get('SizeRw'), 'mounts': row.get('Mounts'), 'cmd': config.get('Cmd'),
              'working_dir': config.get('WorkingDir'), 'image_ref': config.get('Image'),
              'restart_policy': row.get('HostConfig',{}).get('RestartPolicy')}))
          PY
