name: Guarded VPS Project Audit

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "Exact active VPS release commit to audit"
        required: true
        type: string
      project_id:
        description: "Server project identifier to inspect read-only"
        required: true
        type: string
      planning_operation_id:
        description: "Optional exact planning operation ID for safe failure diagnostics"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  project-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout expected commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 1

      - name: Prepare SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_KEY_B64: ${{ secrets.VPS_SSH_KEY_B64 }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "${VPS_SSH_KEY_B64:-${VPS_SSH_KEY:-}}"
          mkdir -p ~/.ssh
          if test -n "${VPS_SSH_KEY_B64:-}"; then
            printf '%s' "$VPS_SSH_KEY_B64" | base64 -d > ~/.ssh/id_ed25519
          else
            printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          fi
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null

      - name: Read and recoverably compress exact inactive backups
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          set -euo pipefail
          remote="${VPS_USER:-root}@${VPS_HOST}"
          ssh -i ~/.ssh/id_ed25519 -p "$VPS_PORT" -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
            "$remote" "flock -w 300 /run/lock/alchemy-media-agent-release.lock python3 - --apply" <<'PY'
          """One-off recoverable compression of two exact inactive October backups."""
          import json
          import os
          import shutil
          import stat
          import subprocess
          import sys
          import tarfile
          from pathlib import Path

          ROOT = Path('/var/backups/alchemy')
          NAMES = ('pr29-11e2eb2cef56-20261011T172217Z', 'pr29-89b6385b15cb-20261011T171100Z')
          ACTIVE = 'ec7023b6119dcb80b3c794c6f46d1e58efdb6c59'
          ROLLBACK = 'b1b229737ad2dee32f94d353254d2c22740c2c18'
          APPLY = sys.argv[1:] == ['--apply']
          assert sys.argv[1:] in ([], ['--apply'])

          def command(*args):
              return subprocess.check_output(args, text=True).strip()

          def guard():
              assert ROOT.resolve() == ROOT and ROOT.is_dir()
              assert command('git', '-C', '/opt/alchemy-media-agent', 'rev-parse', 'HEAD') == ACTIVE
              assert command('docker', 'inspect', 'alchemy-media-agent', '--format', '{{.State.Running}}') == 'true'
              assert command('docker', 'image', 'inspect', 'alchemy-media-agent:rollback-pr29', '--format', '{{index .Config.Labels "org.opencontainers.image.revision"}}') == ROLLBACK
              references = command('docker', 'inspect', *command('docker', 'ps', '-aq').split())
              references += command('systemctl', 'cat', 'alchemy-v2-api.service', 'alchemy-v2-worker.service')
              for process in Path('/proc').iterdir():
                  if not process.name.isdecimal():
                      continue
                  try:
                      references += (process / 'cmdline').read_bytes().replace(b'\0', b' ').decode(errors='replace')
                      for link in [process / 'cwd', process / 'exe', *(process / 'fd').iterdir()]:
                          try:
                              references += os.readlink(link)
                          except (FileNotFoundError, ProcessLookupError):
                              pass
                  except (FileNotFoundError, ProcessLookupError):
                      continue
              # Do not match this script's source: it is streamed on stdin, never argv.
              assert all(str(ROOT / name) not in references for name in NAMES), 'backup_still_referenced'

          def inventory(path):
              assert path.parent == ROOT and path.name in NAMES and path.resolve() == path and path.is_dir()
              pending, records = [path], {}
              while pending:
                  item = pending.pop()
                  info = item.lstat()
                  assert info.st_dev == ROOT.stat().st_dev
                  assert stat.S_ISDIR(info.st_mode) or stat.S_ISREG(info.st_mode), 'non_regular_backup_member'
                  if item.is_file():
                      assert info.st_nlink == 1, 'linked_backup_file'
                  records[item.relative_to(ROOT).as_posix()] = (info.st_mode, info.st_size if item.is_file() else 0,
                      info.st_mtime_ns, info.st_uid, info.st_gid)
                  if item.is_dir():
                      pending.extend(item.iterdir())
              return records

          def verify(archive, source, before):
              seen = set()
              with tarfile.open(archive, 'r:gz') as saved:
                  for member in saved:
                      assert member.name in before and member.name not in seen
                      seen.add(member.name)
                      mode, size, mtime_ns, uid, gid = before[member.name]
                      assert member.mode == stat.S_IMODE(mode) and member.uid == uid and member.gid == gid
                      assert abs(member.mtime - mtime_ns / 1e9) < 0.000001
                      if stat.S_ISDIR(mode):
                          assert member.isdir()
                      else:
                          assert member.isfile() and member.size == size
                          with saved.extractfile(member) as packed, (ROOT / member.name).open('rb') as original:
                              while True:
                                  block = original.read(1024 * 1024)
                                  assert packed.read(1024 * 1024) == block
                                  if not block:
                                      break
              assert seen == set(before) and inventory(source) == before

          guard()
          plans = [(ROOT / name, inventory(ROOT / name)) for name in NAMES]
          print('EXACT_BACKUP_PLAN=' + json.dumps({'apply': APPLY, 'free_bytes': shutil.disk_usage(ROOT).free,
              'items': [{'path': str(path), 'members': len(records), 'file_bytes': sum(v[1] for v in records.values())} for path, records in plans]}), flush=True)
          if APPLY:
              for source, before in plans:
                  guard()
                  assert inventory(source) == before
                  archive = ROOT / (source.name + '.verified.tar.gz')
                  assert not archive.exists() and not archive.is_symlink()
                  with archive.open('xb') as stream:
                      os.chmod(archive, 0o600)
                      subprocess.run(['tar', '--format=pax', '--acls', '--xattrs', '-czf', '-', '-C', str(ROOT), source.name],
                          stdout=stream, check=True)
                      stream.flush()
                      os.fsync(stream.fileno())
                  verify(archive, source, before)
                  guard()
                  assert source.resolve() == ROOT / source.name and inventory(source) == before
                  # Only the exact verified source is removed; complete restorable tar retained.
                  shutil.rmtree(source)
                  print('EXACT_BACKUP_ARCHIVED=' + json.dumps({'archive': str(archive), 'archive_bytes': archive.stat().st_size,
                      'members': len(before), 'content_comparison': 'direct_bytes', 'free_bytes': shutil.disk_usage(ROOT).free}), flush=True)
          print('EXACT_BACKUP_RESULT=pass', flush=True)
          PY
