name: Guarded VPS Project Audit

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "Exact active VPS release commit to audit"
        required: true
        type: string
      project_id:
        description: "Server project identifier to inspect read-only"
        required: true
        type: string
      planning_operation_id:
        description: "Optional exact planning operation ID for safe failure diagnostics"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  project-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout expected commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 1

      - name: Prepare SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_KEY_B64: ${{ secrets.VPS_SSH_KEY_B64 }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "${VPS_SSH_KEY_B64:-${VPS_SSH_KEY:-}}"
          mkdir -p ~/.ssh
          if test -n "${VPS_SSH_KEY_B64:-}"; then
            printf '%s' "$VPS_SSH_KEY_B64" | base64 -d > ~/.ssh/id_ed25519
          else
            printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          fi
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null

      - name: Read V1 V2 records without mutation
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          remote="${VPS_USER:-root}@${VPS_HOST}"
          ssh -i ~/.ssh/id_ed25519 -p "$VPS_PORT" -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
            "$remote" "bash -s -- '$EXPECTED_SHA'" <<'REMOTE_SCRIPT'
          set -euo pipefail
          active_release="$(realpath /opt/alchemy-media-agent)"
          [ "$(git -C "$active_release" rev-parse HEAD)" = "$1" ]
          [ "$(docker inspect alchemy-media-agent --format '{{.State.Running}}')" = true ]
          v1_media="$(docker inspect alchemy-media-agent --format '{{range .Mounts}}{{if eq .Destination "/app/.media_storage"}}{{printf "%s|" .Source}}{{end}}{{end}}')"
          v1_media="${v1_media%|}"
          [ -n "$v1_media" ] && [ "$v1_media" != *'|'* ]
          "$active_release/custom_media_agent_2_0/.venv/bin/python" - "$v1_media" <<'PY'
          import json
          import re
          import sqlite3
          import subprocess
          import sys
          from datetime import datetime, timezone
          from pathlib import Path
          from PIL import Image

          CUTOFF = '2026-11-08T17:20:00'
          v1_root = Path(sys.argv[1]).resolve()
          env = {}
          for line in Path('/etc/alchemy/alchemy-v2.env').read_text(encoding='utf-8').splitlines():
              key, sep, value = line.partition('=')
              if sep and key in {'V2_DATA_DIR', 'V2_STORAGE_DIR'}:
                  if key in env:
                      raise SystemExit('ambiguous_v2_root')
                  env[key] = value.strip().strip('\"\'')
          v2_root = Path(env['V2_STORAGE_DIR']).resolve()

          def pick(item, keys):
              if not isinstance(item, dict):
                  return {}
              return {key: value for key in keys.split() if key in item
                      and ((value := item[key]) is None or type(value) in (bool, int, float)
                           or isinstance(value, str) and len(value) <= 180
                           and re.fullmatch(r'[A-Za-z0-9_./:+ =-]*', value))}

          def db(path):
              connection = sqlite3.connect(path.resolve().as_uri() + '?mode=ro', uri=True, timeout=3)
              connection.execute('PRAGMA query_only=ON')
              return connection

          def recent(connection, table, namespace):
              rows = connection.execute(
                  f"SELECT payload FROM {table} WHERE namespace=? AND json_extract(payload,'$.created_at')>=? "
                  "ORDER BY json_extract(payload,'$.created_at') DESC LIMIT 8", (namespace, CUTOFF))
              return [json.loads(row[0]) for row in rows]

          def record(connection, table, namespace, identity):
              row = connection.execute(f'SELECT payload FROM {table} WHERE namespace=? AND record_key=?',
                                       (namespace, identity)).fetchone()
              return json.loads(row[0]) if row else None

          def file_check(path, root):
              if not path:
                  return {'exists': False}
              path = Path(path).resolve()
              if not path.is_relative_to(root):
                  return {'exists': False, 'outside_root': True}
              if not path.is_file():
                  return {'exists': False}
              result = {'exists': True, 'bytes': path.stat().st_size,
                        'modified_at': datetime.fromtimestamp(path.stat().st_mtime, timezone.utc).isoformat()}
              try:
                  with Image.open(path) as image:
                      result.update(width=image.width, height=image.height, format=image.format)
                      image.verify()
                  result['valid_image'] = True
              except Exception as error:
                  result.update(valid_image=False, error_type=type(error).__name__)
              return result

          def trace(items):
              keys = 'stage status outcome provider model invocation_status latency_ms elapsed_ms duration_ms attempts cache_hit started_at completed_at created_at updated_at at event step attempt failure_class reason code'
              return [pick(item, keys) for item in items[:30] if isinstance(item, dict)] if isinstance(items, list) else []

          def bridge(value):
              return pick(value, 'product profile route state reason task_id receipt_id attempt_id actual_provider actual_model queue_count queue_limit queue_observed_at')

          def elapsed(item):
              try:
                  return round((datetime.fromisoformat(item['updated_at']) - datetime.fromisoformat(item['created_at'])).total_seconds(), 3)
              except (KeyError, ValueError):
                  return None

          v1 = db(v1_root / 'repository.sqlite3')
          v1_jobs = []
          for job in recent(v1, 'v1_records', 'jobs'):
              result = pick(job, 'id status provider model created_at updated_at')
              result['elapsed_seconds'] = elapsed(job)
              summary = job.get('raw_response_summary') or {}
              planning = summary.get('prompt_planning') or {}
              result['planning'] = pick(planning, 'work_intensity llm_used llm_provider llm_model')
              result['planning']['model_attempts'] = trace(planning.get('model_attempts'))
              transport = summary.get('primary_image_transport') or {}
              units = transport.get('units') or {}
              result['bridge_units'] = [bridge(unit) for unit in (units.values() if isinstance(units, dict) else units)]
              result['requested_count'] = (job.get('prompt_plan') or {}).get('count')
              result['has_error'] = bool(job.get('error'))
              result['outputs'] = []
              for output in job.get('outputs', [])[:8]:
                  identity = output.get('id')
                  if not isinstance(identity, str) or not re.fullmatch(r'[A-Za-z0-9_-]+', identity):
                      continue
                  canonical = record(v1, 'v1_records', 'outputs', identity)
                  reservation = record(v1, 'v1_records', 'output_publications', identity)
                  published = bool(canonical)
                  if reservation:
                      published = bool(canonical and canonical.get('id') == identity
                          and canonical.get('job_id') == reservation.get('job_id')
                          and (canonical.get('metadata') or {}).get('veyra_user_id') == reservation.get('owner_id'))
                  paths = list((v1_root / 'generated_images' / str(job.get('id'))).glob(identity + '.*'))
                  result['outputs'].append({**pick(output, 'id job_id url preview_url thumbnail_url'),
                      'canonical_published': published,
                      'original': file_check(paths[0] if len(paths) == 1 else None, v1_root),
                      'preview': file_check(v1_root / 'previews' / (identity + '.webp'), v1_root),
                      'thumbnail': file_check(v1_root / 'thumbnails' / (identity + '.jpg'), v1_root)})
              v1_jobs.append(result)
          v1.close()

          v2 = db(Path(env['V2_DATA_DIR']) / 'repository.sqlite3')
          v2_jobs = []
          for job in recent(v2, 'v2_records', 'image_jobs'):
              result = pick(job, 'job_id run_id status provider_id model created_at updated_at')
              result['elapsed_seconds'] = elapsed(job)
              result['has_error'] = bool(job.get('error'))
              result['outputs'] = []
              for output in job.get('outputs', [])[:8]:
                  identity = output.get('output_id')
                  canonical = record(v2, 'v2_records', 'outputs', identity)
                  metadata = output.get('metadata') or {}
                  result['outputs'].append({**pick(output, 'output_id job_id url created_at'),
                      **pick(metadata, 'preview_url thumbnail_url native_v2_storage preserve_original_bytes'),
                      'canonical_published': bool(canonical and canonical.get('job_id') == job.get('job_id')),
                      'bridge': bridge(metadata.get('render_bridge_primary')),
                      'review': pick(output.get('review'), 'status decision passed reviewer analysis_mode'),
                      'original': file_check(metadata.get('storage_path'), v2_root),
                      'preview': file_check(metadata.get('preview_path'), v2_root),
                      'thumbnail': file_check(metadata.get('thumbnail_path'), v2_root)})
              v2_jobs.append(result)
          v2_runs = []
          for run in recent(v2, 'v2_records', 'creative_runs'):
              decision = run.get('orchestrator_decision') or {}
              v2_runs.append({**pick(run, 'run_id status mode created_at updated_at'),
                  'elapsed_seconds': elapsed(run),
                  'job_ids': [job.get('job_id') for job in run.get('generation_jobs', [])[:8]],
                  'orchestrator': {**pick(decision, 'decision_id provider invocation_status latency_ms attempts cache_hit workspace_id fallback_reason'),
                                   'stages': trace(decision.get('claude_stage_trace'))},
                  'events': trace(run.get('progress_events'))})
          v2.close()
          access = {}
          commands = {
              'v1_api': ['docker', 'logs', '--timestamps', '--since', CUTOFF + 'Z', 'alchemy-media-agent'],
              'v2_api': ['journalctl', '-u', 'alchemy-v2-api.service', '--since', CUTOFF.replace('T', ' ') + ' UTC', '--no-pager', '-o', 'short-iso-precise'],
              'v2_worker': ['journalctl', '-u', 'alchemy-v2-worker.service', '--since', CUTOFF.replace('T', ' ') + ' UTC', '--no-pager', '-o', 'short-iso-precise'],
          }
          for name, command in commands.items():
              completed = subprocess.run(command, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, timeout=25)
              groups = {}
              for line in completed.stdout.decode('utf-8', errors='replace').splitlines():
                  match = re.search(r'"(GET|POST) ((?:/api/v2/|/v1/)[A-Za-z0-9_/-]+) HTTP/[0-9.]+" ([1-5][0-9]{2})', line)
                  if not match:
                      continue
                  method, route, status = match.groups()
                  if not (method == 'POST' and route in {'/v1/image/jobs', '/api/v2/creative/runs', '/api/v2/creative/runs/async', '/api/v2/image/jobs'}
                          or method == 'GET' and any(identity in route for identity in ['out_14b7848fe6a16a0e5cfdb44376f9f0bf', 'out_job_5acd90a3231f_0'])):
                      continue
                  key = (method, route, status)
                  at = line.split(' ', 1)[0]
                  if key not in groups:
                      groups[key] = {'method': method, 'route': route, 'status': int(status), 'count': 0, 'first_at': at}
                  groups[key]['count'] += 1
                  groups[key]['last_at'] = at
              access[name] = {'exit_code': completed.returncode, 'requests': list(groups.values())[:24]}
          print(json.dumps({'snapshot_at': datetime.now(timezone.utc).isoformat(), 'v1_jobs': v1_jobs,
                            'v2_jobs': v2_jobs, 'v2_runs': v2_runs, 'access': access}, separators=(',', ':')))
          PY
          printf 'GUARDED_V12_AUDIT_RESULT=pass\n'
          printf 'GUARDED_V12_AUDIT_ACTIVE_SHA=%s\n' "$1"
          REMOTE_SCRIPT
