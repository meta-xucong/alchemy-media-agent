name: Guarded VPS Project Audit

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "Exact active VPS release commit to audit"
        required: true
        type: string
      project_id:
        description: "Server project identifier to inspect read-only"
        required: true
        type: string
      planning_operation_id:
        description: "Optional exact planning operation ID for safe failure diagnostics"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  project-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout expected commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 1

      - name: Prepare SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_KEY_B64: ${{ secrets.VPS_SSH_KEY_B64 }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "${VPS_SSH_KEY_B64:-${VPS_SSH_KEY:-}}"
          mkdir -p ~/.ssh
          if test -n "${VPS_SSH_KEY_B64:-}"; then
            printf '%s' "$VPS_SSH_KEY_B64" | base64 -d > ~/.ssh/id_ed25519
          else
            printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          fi
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null

      - name: Read V2 review configuration and durable evidence
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          remote="${VPS_USER:-root}@${VPS_HOST}"
          ssh -i ~/.ssh/id_ed25519 -p "$VPS_PORT" -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
            "$remote" "bash -s -- '$EXPECTED_SHA'" <<'REMOTE_SCRIPT'
          set -euo pipefail
          active_release="$(realpath /opt/alchemy-media-agent)"
          [ "$(git -C "$active_release" rev-parse HEAD)" = "$1" ]
          "$active_release/custom_media_agent_2_0/.venv/bin/python" - <<'PY'
          """Read-only V2 review audit. Never import the production application."""
          import ast
          import json
          import re
          import sqlite3
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          release = Path('/opt/alchemy-media-agent').resolve()
          review_keys = {'V2_OUTPUT_REVIEW_AGENT_ENABLED', 'V2_OUTPUT_REVIEW_AGENT_MODEL', 'V2_AGENT_DEFAULT_MODEL'}
          path_keys = {'V2_DATA_DIR', 'V2_ENV_FILE'}

          def parse_env(path):
              result = {}
              if path.is_file():
                  for line in path.read_text(encoding='utf-8-sig').splitlines():
                      line = line.strip()
                      if line.startswith('export '):
                          line = line[7:].strip()
                      key, sep, value = line.partition('=')
                      if sep and key.strip() in review_keys | path_keys:
                          result[key.strip()] = value.strip().strip('"').strip("'")
              return result

          def safe_values(values):
              return {key: value for key, value in values.items() if key in review_keys
                      and len(value) < 120 and re.fullmatch(r'[A-Za-z0-9_./:+ -]*', value)}

          env_file = parse_env(Path('/etc/alchemy/alchemy-v2.env'))
          runtime = []
          for service in ('alchemy-v2-api.service', 'alchemy-v2-worker.service'):
              pid_text = subprocess.check_output(['systemctl', 'show', service, '--property=MainPID', '--value'], text=True).strip()
              assert pid_text.isdecimal() and int(pid_text) > 0
              entries = Path(f'/proc/{pid_text}/environ').read_bytes().split(b'\0')
              env = {}
              for raw in entries:
                  key, sep, value = raw.partition(b'=')
                  decoded_key = key.decode('utf-8', errors='replace')
                  if sep and decoded_key in review_keys | path_keys:
                      env[decoded_key] = value.decode('utf-8', errors='replace')
              effective = dict(env)
              if effective.get('V2_ENV_FILE'):
                  for key, value in parse_env(Path(effective['V2_ENV_FILE'])).items():
                      effective.setdefault(key, value)
              for key, value in parse_env(release / 'custom_media_agent_2_0/.env').items():
                  effective.setdefault(key, value)
              data_root = Path(effective.get('V2_DATA_DIR', str(release / 'custom_media_agent_2_0/.v2_data')))
              for key, value in parse_env(data_root / 'llm_gateway.env').items():
                  effective.setdefault(key, value)
              runtime.append({'service': service, 'process_environment': safe_values(env),
                              'startup_effective_review_settings': safe_values(effective)})

          source = (release / 'custom_media_agent_2_0/app/services/visual_review_agent.py').read_text(encoding='utf-8')
          tree = ast.parse(source)
          calls = sorted({ast.unparse(node.func) for node in ast.walk(tree) if isinstance(node, ast.Call)})
          source_audit = {
              'has_metadata_fallback_literal': 'sdk_agent_metadata_fallback' in source,
              'has_live_vision_not_configured_note': 'live vision-model inspection is not configured yet' in source,
              'has_runner_call': any('Runner' in name or name.startswith('Runner.') for name in calls),
              'calls': calls,
          }

          database = Path(env_file['V2_DATA_DIR']) / 'repository.sqlite3'
          connection = sqlite3.connect(database.resolve().as_uri() + '?mode=ro', uri=True, timeout=3)
          connection.execute('PRAGMA query_only=ON')
          rows = connection.execute("SELECT payload FROM v2_records WHERE namespace='image_jobs' ORDER BY json_extract(payload,'$.created_at') DESC LIMIT 4").fetchall()
          connection.close()
          jobs = []
          for row in rows:
              job = json.loads(row[0])
              plan = job.get('prompt_plan') or {}
              variables = plan.get('user_variables') or {}
              inputs = variables.get('provider_input_plan') or {}
              contract = variables.get('reference_delivery') or {}
              outputs = []
              for output in job.get('outputs', [])[:4]:
                  review = output.get('review') or {}
                  metadata = output.get('metadata') or {}
                  notes = review.get('notes') or []
                  outputs.append({
                      'output_id': output.get('output_id'), 'live': bool(metadata.get('live')),
                      'has_trace_id': bool(review.get('agent_trace_id')),
                      'review': {key: review.get(key) for key in ('reviewer', 'analysis_mode', 'decision', 'score')},
                      'risk_codes': [value for value in review.get('detected_risks', []) if isinstance(value, str) and re.fullmatch(r'[a-z0-9_]{1,100}', value)],
                      'note_live_vision_unconfigured': any('live vision-model inspection is not configured yet' in note for note in notes),
                      'note_ready_for_human_review': any('ready for human visual review' in note for note in notes),
                  })
              jobs.append({'job_id': job.get('job_id'), 'run_id': job.get('run_id'), 'status': job.get('status'),
                           'created_at': job.get('created_at'), 'updated_at': job.get('updated_at'),
                           'requires_image_reference': bool(inputs.get('requires_image_reference')),
                           'reference_image_count': inputs.get('reference_image_count'),
                           'has_reference_delivery_contract': bool(contract), 'outputs': outputs})

          print(json.dumps({'snapshot_at': datetime.now(timezone.utc).isoformat(),
                            'env_file_review_settings': safe_values(env_file), 'runtime': runtime,
                            'production_review_source': source_audit, 'jobs': jobs}, separators=(',', ':')))
          PY
          printf 'GUARDED_V2_REVIEW_AUDIT_RESULT=pass\n'
          printf 'GUARDED_V2_REVIEW_AUDIT_ACTIVE_SHA=%s\n' "$1"
          REMOTE_SCRIPT
