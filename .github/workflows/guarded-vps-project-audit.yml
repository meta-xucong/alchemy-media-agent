name: Guarded VPS Project Audit

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "Exact active VPS release commit to audit"
        required: true
        type: string
      project_id:
        description: "Server project identifier to inspect read-only"
        required: true
        type: string
      planning_operation_id:
        description: "Optional exact planning operation ID for safe failure diagnostics"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  project-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout expected commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 1

      - name: Prepare SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_KEY_B64: ${{ secrets.VPS_SSH_KEY_B64 }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "${VPS_SSH_KEY_B64:-${VPS_SSH_KEY:-}}"
          mkdir -p ~/.ssh
          if test -n "${VPS_SSH_KEY_B64:-}"; then
            printf '%s' "$VPS_SSH_KEY_B64" | base64 -d > ~/.ssh/id_ed25519
          else
            printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          fi
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null

      - name: Read existing review through encrypted diagnostics
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          remote="${VPS_USER:-root}@${VPS_HOST}"
          ssh -i ~/.ssh/id_ed25519 -p "$VPS_PORT" -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
            "$remote" "bash -s -- '$EXPECTED_SHA'" <<'REMOTE'
          set -euo pipefail
          active="$(realpath /opt/alchemy-media-agent)"
          [ "$(git -C "$active" rev-parse HEAD)" = "$1" ]
          "$active/custom_media_agent_2_0/.venv/bin/python" - <<'PY'
          import json, sqlite3, sys, os, base64
          from pathlib import Path
          from cryptography.hazmat.primitives import serialization, hashes
          from cryptography.hazmat.primitives.asymmetric import padding
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          env = {}
          for line in Path('/etc/alchemy/alchemy-v2.env').read_text(encoding='utf-8').splitlines():
              name, sep, value = line.partition('=')
              if sep and name in {'V2_DATA_DIR','V2_OUTPUT_REVIEW_AGENT_MODEL','V2_AGENT_DEFAULT_MODEL','V2_CLAUDE_ORCHESTRATOR_MODEL','V2_CLAUDE_ORCHESTRATOR_MULTIMODAL_MODEL','V2_CLAUDE_ORCHESTRATOR_FALLBACK_MODELS','V2_CLAUDE_ORCHESTRATOR_FALLBACK_MODEL'}:
                  env[name] = value.strip().strip('"').strip("'")
          root = Path(env['V2_DATA_DIR'])
          conn = sqlite3.connect((root/'repository.sqlite3').as_uri()+'?mode=ro', uri=True)
          conn.execute('PRAGMA query_only=ON')
          def record(ns,key):
              row = conn.execute('SELECT payload FROM v2_records WHERE namespace=? AND record_key=?',(ns,key)).fetchone()
              return json.loads(row[0]) if row else None
          job = record('image_jobs','job_f0631661d94e')
          output = record('outputs','out_job_f0631661d94e_0')
          runtime = json.loads((root/'runtime_model_settings.json').read_text(encoding='utf-8'))
          data = {'review': output['review'], 'prompt_plan': job['prompt_plan'],
                  'input_images': output['metadata'].get('input_images',[]),
                  'model_env': {k:v for k,v in env.items() if k != 'V2_DATA_DIR'},
                  'runtime_models': {k:runtime[k] for k in ('default_agent_model','output_review_agent_model','claude_orchestrator_model','claude_orchestrator_multimodal_model','claude_orchestrator_fallback_models','claude_orchestrator_fallback_model') if k in runtime}}
          conn.close()
          public = serialization.load_pem_public_key('-----BEGIN PUBLIC KEY-----\nMIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAsJXjfMfxb9o14TlHzgHa\nb7yx4eE61GiARUZHpGvKlW2STr3Ht2vm5xqxpj6nx7V0n0n9HkiKVqMUGHcjyfb3\nu670qeQVWqcnTOeG76g1IL+PWUhTgYTqeJIqPc7jJafQaTp0yJnlEMMXAinp4STr\nnoLKPT2YOR2GWKoVa90LVdSs53GUOTr2Hh4t9f3uNOr+F4z6lQK9qvb0Ap0wRrad\n2fzGIXZyQuQR/TyGuy9FKAhBp5mTSPaPkapbgEKcQa0gPFmwduQ9CKdVh6j78Tm5\nWiHrIsK6K0i90EoRnsjDiWHFYIVm0qFuxQHiOKco9LbgwMc0P9JL2+58ChUffCvX\n9QIDAQAB\n-----END PUBLIC KEY-----\n'.encode())
          session_key = os.urandom(32)
          nonce = os.urandom(12)
          cipher = AESGCM(session_key).encrypt(nonce,json.dumps(data,ensure_ascii=False).encode(),None)
          wrapped = public.encrypt(session_key,padding.OAEP(mgf=padding.MGF1(algorithm=hashes.SHA256()),algorithm=hashes.SHA256(),label=None))
          print('PRIVATE_REVIEW='+json.dumps({k:base64.b64encode(v).decode() for k,v in {'key':wrapped,'nonce':nonce,'cipher':cipher}.items()}))
          PY
          REMOTE
