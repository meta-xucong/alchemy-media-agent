name: Guarded VPS Project Audit

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "Exact active VPS release commit to audit"
        required: true
        type: string
      project_id:
        description: "Server project identifier to inspect read-only"
        required: true
        type: string
      planning_operation_id:
        description: "Optional exact planning operation ID for safe failure diagnostics"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  project-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout expected commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 1

      - name: Prepare SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_KEY_B64: ${{ secrets.VPS_SSH_KEY_B64 }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "${VPS_SSH_KEY_B64:-${VPS_SSH_KEY:-}}"
          mkdir -p ~/.ssh
          if test -n "${VPS_SSH_KEY_B64:-}"; then
            printf '%s' "$VPS_SSH_KEY_B64" | base64 -d > ~/.ssh/id_ed25519
          else
            printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          fi
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null

      - name: Read existing output and review isolated candidate copy
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          remote="${VPS_USER:-root}@${VPS_HOST}"
          ssh -i ~/.ssh/id_ed25519 -p "$VPS_PORT" -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
            "$remote" "bash -s -- '$EXPECTED_SHA'" <<'REMOTE_SCRIPT'
          set -euo pipefail
          expected="$1"
          candidate="/opt/alchemy-media-agent-releases/doc276-277-${expected:0:12}"
          [ "$(git -C "$candidate" rev-parse HEAD)" = "$expected" ]
          [ "$(git -C /opt/alchemy-media-agent rev-parse HEAD)" = "b1b229737ad2dee32f94d353254d2c22740c2c18" ]
          "$candidate/custom_media_agent_2_0/.venv/bin/python" - "$candidate" <<'PY'
          """One real review of an existing output in isolated candidate storage."""
          import asyncio
          import json
          import os
          import shutil
          import sqlite3
          import sys
          import tempfile
          from pathlib import Path

          release = Path(sys.argv[1]).resolve()
          def env_file(path):
              values = {}
              if path.is_file():
                  for line in path.read_text(encoding='utf-8-sig').splitlines():
                      key, sep, value = line.strip().removeprefix('export ').partition('=')
                      if sep and key and not key.startswith('#'):
                          values[key] = value.strip().strip('"').strip("'")
              return values

          configuration = env_file(Path('/etc/alchemy/alchemy-v2.env'))
          source_root = Path(configuration['V2_DATA_DIR'])
          configuration.update(env_file(source_root / 'llm_gateway.env'))
          runtime_path = source_root / 'runtime_model_settings.json'
          runtime = json.loads(runtime_path.read_text(encoding='utf-8')) if runtime_path.is_file() else {}
          model = runtime.get('output_review_agent_model') or runtime.get('default_agent_model') or configuration.get('V2_OUTPUT_REVIEW_AGENT_MODEL') or configuration.get('V2_AGENT_DEFAULT_MODEL')
          assert model
          source_db = source_root / 'repository.sqlite3'
          def source_record():
              connection = sqlite3.connect(source_db.resolve().as_uri() + '?mode=ro', uri=True)
              connection.execute('PRAGMA query_only=ON')
              row = connection.execute("SELECT payload FROM v2_records WHERE namespace='image_jobs' AND record_key=?", ('job_1af28dcba4ba',)).fetchone()
              connection.close()
              assert row
              return row[0]

          original_record = source_record()
          payload = json.loads(original_record)
          assert payload['status'] == 'completed' and len(payload['outputs']) == 1
          assert not payload['outputs'][0]['metadata'].get('input_images')
          source_image = Path(payload['outputs'][0]['metadata']['storage_path'])
          source_bytes = source_image.read_bytes()

          with tempfile.TemporaryDirectory(prefix='v2-candidate-vision-') as scratch:
              scratch = Path(scratch)
              storage = scratch / 'storage'
              storage.mkdir()
              copied_image = storage / source_image.name
              shutil.copy2(source_image, copied_image)
              for key in ('LLM_GATEWAY_API_KEY', 'LLM_GATEWAY_BASE_URL'):
                  assert configuration.get(key), key + '_not_configured'
                  os.environ[key] = configuration[key]
              os.environ.update(V2_ENV_FILE=str(scratch / 'absent.env'), V2_DATA_DIR=str(scratch / 'data'),
                  V2_STORAGE_DIR=str(storage), V2_TASK_QUEUE_DB_PATH=str(scratch / 'queue.sqlite3'),
                  V2_OUTPUT_REVIEW_AGENT_ENABLED='true', V2_OUTPUT_REVIEW_AGENT_MODEL=model,
                  V2_OUTPUT_REVIEW_TIMEOUT_SECONDS='300', OPENAI_AGENTS_DISABLE_TRACING='1', ORT_DISABLE_TELEMETRY='1',
                  ALCHEMY_RENDER_BRIDGE_PRIMARY_CONFIG=str(scratch / 'absent-control.json'),
                  ALCHEMY_RENDER_BRIDGE_PRIMARY_STATE_ROOT=str(scratch / 'ledgers'))
              sys.path[:0] = [str(release / 'custom_media_agent_2_0'), str(release)]
              from app.repositories import repository
              from app.schemas import ImageJob
              from app.services.output_review import review_image_job
              from app.services.generation import finish_image_review
              from app.services import visual_review_agent as vision
              payload['outputs'][0]['metadata']['storage_path'] = str(copied_image)
              job = review_image_job(ImageJob.model_validate(payload))
              repository.save_image_job(job)
              calls = []
              invoke = vision._request_verdict
              async def traced(content, selected_model):
                  calls.append(selected_model)
                  try:
                      return await invoke(content, selected_model)
                  except Exception as error:
                      import httpx
                      detail = {'type': type(error).__name__}
                      if isinstance(error, httpx.HTTPStatusError):
                          detail['http_status'] = error.response.status_code
                      print('SAFE_REVIEW_FAILURE=' + json.dumps(detail), flush=True)
                      raise
              vision._request_verdict = traced
              reviewed = asyncio.run(finish_image_review(job))
              again = asyncio.run(finish_image_review(reviewed))
              verdict = reviewed.outputs[0].review
              assert source_record() == original_record and source_image.read_bytes() == source_bytes
              assert copied_image.read_bytes() == source_bytes
              assert len(calls) == 1 and again.outputs[0].review == verdict
              print('CANDIDATE_VISION_RESULT=' + json.dumps({
                  'analysis_mode': verdict.analysis_mode, 'decision': verdict.decision, 'model': verdict.model,
                  'elapsed_ms': verdict.elapsed_ms, 'failure_code': verdict.failure_code,
                  'note_count': len(verdict.notes), 'request_count': len(calls), 'original_bytes_unchanged': True,
                  'production_record_unchanged': True, 'canonical_verdict_persisted': repository.get_output(reviewed.outputs[0].output_id).review == verdict,
                  'output_id': reviewed.outputs[0].output_id, 'production_writes': False}), flush=True)
              assert verdict.analysis_mode == 'vision_model', 'real_vision_not_verified'
          PY
          printf 'GUARDED_CANDIDATE_VISION_RESULT=pass\n'
          REMOTE_SCRIPT
