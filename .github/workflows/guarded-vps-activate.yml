          systemctl start alchemy-v2-worker.service || fail_post v2_worker_start_failed
          systemctl is-active --quiet alchemy-v2-worker.service || fail_post v2_worker_not_active
          systemctl start alchemy-v2-sync-worker.service || fail_post v2_sync_worker_start_failed
          systemctl is-active --quiet alchemy-v2-sync-worker.service || fail_post v2_sync_worker_not_active
          verify_v2_runtime_roots || fail_post candidate_v2_storage_roots_unverified
          verify_v2_unit_contract || fail_post candidate_v2_unit_contract_unverified
          api_pid="$(systemctl show alchemy-v2-api.service --property=MainPID --value)"
          [[ "$api_pid" =~ ^[1-9][0-9]*$ ]] || fail_post candidate_v2_api_pid_unavailable_after_admission
          python3 "$candidate_release/scripts/vps_cutover_guard.py" verify-v2-api-no-background-writers \
            --pid "$api_pid" || fail_post candidate_v2_api_background_writer_enabled_after_admission
          [ "$(state_digest "$v1_media")" = "$before_digest" ] || fail_post historical_state_changed_before_public_open
          rm -f "$maintenance_flag" || fail_post public_gate_open_failed
          systemctl reload nginx || fail_public_open nginx_reload_after_gate_open_failed
          maintenance_active=0
          wait_for_200 "$public_base_url/api/v2/health" || fail_public_open v2_public_health_failed
          desktop_status="$(curl -ksS --connect-timeout 10 --max-time 20 -o /dev/null -w '%{http_code}' "$public_base_url/creative-agent-v3?workspace=professional" || true)"
          route_ok "$desktop_status" || fail_public_open desktop_route_unhealthy
          h5_status="$(curl -ksS --connect-timeout 10 --max-time 20 -o /dev/null -w '%{http_code}' "$public_base_url/h5" || true)"
          route_ok "$h5_status" || fail_public_open h5_route_unhealthy
          static_contains "$public_base_url/static/app.js" review_withheld_face_integrity || fail_public_open public_desktop_static_marker_missing
          static_contains "$public_base_url/mobile-static/mobile.js" review_withheld_face_integrity || fail_public_open public_mobile_static_marker_missing
          project_status="$(curl -ksS --connect-timeout 10 --max-time 20 -o /dev/null -w '%{http_code}' "$public_base_url/api/v3/creative-agent/projects" || true)"
          protected_ok "$project_status" || fail_public_open v3_projects_not_protected
          if [ "$maintenance_timer_was_active" = 1 ]; then
            systemctl start alchemy-v3-storage-maintenance.timer || fail_public_open maintenance_timer_restore_failed
            systemctl is-active --quiet alchemy-v3-storage-maintenance.timer || fail_public_open maintenance_timer_restore_unverified
          else
            systemctl is-active --quiet alchemy-v3-storage-maintenance.timer && fail_public_open maintenance_timer_unexpectedly_active
          fi

          printf 'GUARDED_ACTIVATE_RESULT=pass\n'
          printf 'GUARDED_ACTIVATE_TARGET_SHA=%s\n' "$expected_sha"
          printf 'GUARDED_ACTIVATE_OLD_RELEASE=%s\n' "$old_release"
          printf 'GUARDED_ACTIVATE_ACTIVE_RELEASE=%s\n' "$(realpath "$deploy_link")"
          printf 'GUARDED_ACTIVATE_HEALTH=v1_v2_local_public_200\n'
          printf 'GUARDED_ACTIVATE_FRONTEND=desktop_h5_static_markers_verified\n'
          printf 'GUARDED_ACTIVATE_PROTECTION=v3_projects_%s\n' "$project_status"
          printf 'GUARDED_ACTIVATE_HISTORICAL_STATE=unchanged\n'
          printf 'GUARDED_ACTIVATE_ROLLBACK=not_needed\n'
          REMOTE_SCRIPT
