          if [ "$maintenance_timer_was_active" = 1 ]; then systemctl stop alchemy-v3-storage-maintenance.timer || stop_pre maintenance_timer_stop_failed; fi
          if systemctl is-active --quiet alchemy-v3-storage-maintenance.service; then
            systemctl stop alchemy-v3-storage-maintenance.service || stop_pre maintenance_service_stop_failed
          fi
          systemctl is-active --quiet alchemy-v3-storage-maintenance.timer && stop_pre maintenance_timer_still_active
          systemctl is-active --quiet alchemy-v3-storage-maintenance.service && stop_pre maintenance_service_still_active
          writers_stopped=1
          for unit in "${v2_units[@]}"; do systemctl stop "$unit" || stop_pre "${unit}_stop_failed"; done
          docker stop --time 45 "$v1_container" >/dev/null || stop_pre v1_graceful_stop_failed
          for unit in "${v2_units[@]}"; do
            systemctl is-active --quiet "$unit" && stop_pre "${unit}_still_active"
          done
          [ "$(docker inspect "$v1_container" --format '{{.State.Running}}' 2>/dev/null || true)" != true ] || stop_pre v1_still_running
          systemctl is-active --quiet alchemy-v3-storage-maintenance.timer && stop_pre maintenance_timer_restarted
          systemctl is-active --quiet alchemy-v3-storage-maintenance.service && stop_pre maintenance_service_restarted
          verify_v3_runtime_storage_roots "$old_env" || stop_pre durable_v3_storage_roots_changed_while_fencing
          verify_v3_runtime_storage_roots "$candidate_release/src_skeleton/.env" || stop_pre candidate_v3_storage_roots_changed_while_fencing
          python3 "$candidate_release/scripts/vps_cutover_guard.py" inspect-active-work \
            --v1-database "$v1_media/repository.sqlite3" --v2-queue-database "$v2_queue_db" \
            --v3-projects-root "$v1_media/v3_projects" || stop_pre durable_work_changed_while_fencing
          backup_stores || stop_pre consistent_store_backup_failed
          require_disk_floor "$maintenance_backup_root" || stop_pre backup_consumed_disk_reserve
          require_post_backup_data_capacity "$maintenance_backup/database-inventory.bin" || stop_pre backup_consumed_data_reserve
          rm -f "$maintenance_backup/database-inventory.bin"
          prepare_and_verify_target_indexes || stop_pre target_history_index_prepare_or_verify_failed

          # From here until the candidate has passed local readiness, requests
          # remain fenced at Nginx, dedicated consumers stay stopped, and all
          # durable databases have a verified snapshot.
          docker tag "$old_image" alchemy-media-agent:rollback-pr29 || stop_pre old_image_tag_failed
          docker tag "$candidate_image" alchemy-media-agent:latest || stop_pre candidate_image_activation_tag_failed
          install_v2_unit_contract || stop_pre candidate_v2_unit_contract_install_failed
          verify_v2_unit_contract || stop_pre candidate_v2_unit_contract_invalid
          verify_v2_runtime_unit_roots || stop_pre candidate_v2_unit_storage_roots_unverified
          atomic_repoint "$candidate_release" candidate || stop_pre candidate_link_switch_failed
          remove_v1 || fail_post candidate_container_remove_failed
          candidate_services_started=1
          compose_for "$candidate_release" up -d --no-build alchemy-media-agent >/dev/null || fail_post candidate_container_start_failed
          verify_v3_runtime_storage_roots "$candidate_release/src_skeleton/.env" || fail_post candidate_v3_storage_roots_unverified
          systemctl start alchemy-v2-api.service >/dev/null || fail_post v2_api_start_failed
          systemctl is-active --quiet alchemy-v2-api.service || fail_post v2_api_not_active
          wait_for_200 http://127.0.0.1:8017/healthz || fail_post v1_health_failed
          wait_for_200 http://127.0.0.1:8020/api/v2/health || fail_post v2_local_health_failed
          api_pid="$(systemctl show alchemy-v2-api.service --property=MainPID --value)"
          [[ "$api_pid" =~ ^[1-9][0-9]*$ ]] || fail_post candidate_v2_api_pid_unavailable
          python3 "$candidate_release/scripts/vps_cutover_guard.py" verify-v2-api-no-background-writers \
            --pid "$api_pid" || fail_post candidate_v2_api_background_writer_enabled
          [ "$(realpath "$deploy_link")" = "$candidate_release" ] || fail_post active_release_mismatch
          [ "$(git -C "$(realpath "$deploy_link")" rev-parse HEAD)" = "$expected_sha" ] || fail_post active_head_mismatch
          [ "$(read_mount /app/.env)" = "$candidate_release/src_skeleton/.env" ] || fail_post candidate_env_not_bound
          python3 "$candidate_release/ops/vps-release/v2_runtime_guard.py" --release "$candidate_release" --verify || fail_post active_v2_runtime_guard_failed
          verify_v2_unit_contract || fail_post active_v2_unit_contract_invalid
          docker run --rm --network none \
            --mount "type=bind,src=$v1_media,dst=/app/.media_storage" \
            --mount "type=bind,src=$candidate_release/scripts/prepare_v1_history_index.py,dst=/app/scripts/prepare_v1_history_index.py,readonly" \
            -e MEDIA_STORAGE_ROOT=/app/.media_storage -e PYTHONPATH=/app \
            -e MEDIA_AGENT_PERSIST_RUNTIME_SETTINGS=false \
            --entrypoint python "$candidate_image" \
            /app/scripts/prepare_v1_history_index.py --storage-root /app/.media_storage --verify || fail_post active_v1_history_index_unready
          runuser -u alchemy -- env V2_DATA_DIR="$v2_data" V2_STORAGE_DIR="$v2_storage" \
            V2_IMAGE_HISTORY_PATH="$v2_history_path" V2_TASK_QUEUE_DB_PATH="$v2_queue_db" \
            "$candidate_release/custom_media_agent_2_0/.venv/bin/python" \
            "$candidate_release/scripts/verify_v2_history_reads.py" \
            --data-root "$v2_data" --history-path "$v2_history_path" || fail_post active_v2_history_index_unready
          for unit in alchemy-v2-worker.service alchemy-v2-sync-worker.service; do
            systemctl is-active --quiet "$unit" && fail_post "${unit}_started_before_admission"
          done
          docker exec "$v1_container" grep -Fq 'review_withheld_face_integrity' /app/app/static/app.js || fail_post desktop_face_review_marker_missing
          docker exec "$v1_container" grep -Fq 'review_withheld_face_integrity' /app/app/mobile_static/mobile.js || fail_post mobile_face_review_marker_missing
