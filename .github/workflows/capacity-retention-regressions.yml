name: Capacity and retention regressions

on:
  pull_request:
    paths:
      - "src_skeleton/**"
      - "custom_media_agent_2_0/**"
      - "alchemy_creative_agent_3_0/**"
      - "tests/**"
      - "docs/migrations/**"
      - "docs/history-read-scalability/**"
      - "docs/v3-review-image-visibility/**"
      - "scripts/benchmark_history_reads.py"
      - "scripts/probe_browser_history_windows.mjs"
      - "scripts/prepare_v1_history_index.py"
      - "scripts/prepare_v2_history_reads.py"
      - ".github/workflows/capacity-retention-regressions.yml"
  push:
    branches: ["codex/durable-bounded-retention"]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Set before Python/native libraries initialize, not after an OCR session.
  ORT_DISABLE_TELEMETRY: "1"
  OPENAI_AGENTS_DISABLE_TRACING: "1"

concurrency:
  group: retention-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  v3-review-export-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MEDIA_AGENT_MODE: mock
      MEDIA_STORAGE_ROOT: ${{ github.workspace }}/.ci-v3-review-media
      CODEX_AUTH_FILE: /tmp/nonexistent-v3-review-auth.json
      CLAUDE_SETTINGS_FILE: /tmp/nonexistent-v3-review-claude.json
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated V3 contract dependencies
        run: python -m pip install pytest==8.3.3 pydantic==2.13.4 Pillow==12.3.0 httpx==0.28.1 python-dotenv==1.2.2 playwright==1.62.0
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Verify export eligibility and real desktop/mobile review UI
        run: >-
          python -m pytest -q
          alchemy_creative_agent_3_0/tests/test_v3_generic_export_review_gate.py
          alchemy_creative_agent_3_0/tests/test_v3_doc263_ecommerce_ui_recovery_browser.py
          --junitxml=${{ runner.temp }}/v3-review-acceptance.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v3-review-acceptance-${{ github.sha }}
          path: ${{ runner.temp }}/v3-review-acceptance.xml
          if-no-files-found: warn

  history-browser-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify desktop and mobile history demand contracts
        run: |
          node --check src_skeleton/app/static/app.js
          node --check src_skeleton/app/mobile_static/mobile.js
          node --check src_skeleton/app/static/account-access.js
          node scripts/probe_browser_history_windows.mjs --check
          node --test tests/*.test.mjs
      - name: Install pinned isolated Chromium probe dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/history-browser-probe" --no-audit --no-fund playwright@1.62.1
          node "$RUNNER_TEMP/history-browser-probe/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Measure real Chromium history windows with synthetic intercepted data
        timeout-minutes: 7
        env:
          PLAYWRIGHT_MODULE_PATH: ${{ runner.temp }}/history-browser-probe/node_modules/playwright
        run: |
          set -o pipefail
          node scripts/probe_browser_history_windows.mjs "$RUNNER_TEMP/history-browser-probe.json" 2>&1 | tee "$RUNNER_TEMP/history-browser-probe.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: history-browser-probe-${{ github.sha }}
          path: |
            ${{ runner.temp }}/history-browser-probe.json
            ${{ runner.temp }}/history-browser-probe.log
          if-no-files-found: warn

  windows-source-fidelity:
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      PYTHONPATH: src_skeleton
      MEDIA_STORAGE_ROOT: ${{ github.workspace }}/.ci-media-source-fidelity
      CODEX_AUTH_FILE: /tmp/nonexistent-media-auth.json
      CLAUDE_SETTINGS_FILE: /tmp/nonexistent-media-claude.json
      MEDIA_AGENT_MODE: mock
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install source and migration contract test dependencies
        run: python -m pip install pytest pydantic==2.13.4 python-dotenv==1.2.2
      - name: Fetch the frozen PR28 migration evidence source
        run: git fetch --no-tags --depth=1 origin 8c6dca317ece2538004bb0921f28ec8f188146cd
      - name: Verify Windows source fidelity and LF versus CRLF invariance
        run: python -m pytest -q tests/test_pr28_migration_reconciliation.py
      - name: Verify bounded read admission on Windows
        run: python -m pytest -q tests/test_sqlite_read_admission.py

  v1-retention:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CODEX_AUTH_FILE: /tmp/nonexistent-media-auth.json
      CLAUDE_SETTINGS_FILE: /tmp/nonexistent-media-claude.json
      OPENAI_API_KEY: ""
      ANTHROPIC_AUTH_TOKEN: ""
      V3_LLM_BRAIN_REMOTE_ENABLED: "false"
      LLM_PROMPT_PLANNING_ENABLED: "false"
      MEDIA_AGENT_PERSIST_RUNTIME_SETTINGS: "false"
      MEDIA_AGENT_MODE: mock
      MOCK_IMAGE_PROVIDER_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install V1 test dependencies
        run: python -m pip install -e './src_skeleton[dev]'
      - name: Fetch the frozen PR28 migration evidence source
        run: git fetch --no-tags --depth=1 origin 8c6dca317ece2538004bb0921f28ec8f188146cd
      - name: Verify durable records, ownership, cancellation and Lab recovery
        run: >-
          python -m pytest -q
          tests/test_v1_persistent_retention.py
          tests/test_v1_history_retention_bounds.py
          tests/test_v1_lab_history_index.py
          tests/test_v1_favorite_history_pages.py
          tests/test_v1_image_publication_security.py
          tests/test_v1_favorites_retention.py
          tests/test_v1_favorites_migration_atomicity.py
          tests/test_v1_history_delete_atomicity.py
          tests/test_v1_idempotency_scope.py
          tests/test_v1_session_ownership.py
          tests/test_v1_sqlite_async_boundary.py
          tests/test_v1_sqlite_cancellation_capacity.py
          tests/test_sqlite_read_admission.py
          tests/test_history_benchmark_safety.py
          tests/test_lab_interrupted_recovery.py
          tests/test_lab_snapshot_concurrency.py
          tests/test_v1_event_stream_thread_handoff.py
          tests/test_pr28_migration_reconciliation.py
          tests/test_v1_history_strict_import.py
          tests/test_v1_import_error_api.py
      - name: Run the complete V1 API smoke file with mock providers
        run: python -m pytest -q tests/test_api_smoke.py
      - name: Verify isolated V1 and Lab read matrix
        run: |
          python scripts/benchmark_history_reads.py --surfaces v1,lab --sizes 100,1000 --concurrency 2,4,8 --rounds 1 --output /tmp/v1-lab-history-read.json
          python - <<'PY'
          import json
          import math


          def validate_report(report):
              assert report['source_unchanged_during_run'] is True
              assert report['checkout_default_storage_unchanged'] is True
              config = report['configuration']
              assert config['index_lifecycle'] == 'explicit' and config['skip_cold_probe'] is False
              assert config['surfaces'] and set(config['surfaces']) <= {'v1', 'lab', 'v2'}
              assert config['sizes'] and all(type(size) is int and size > 0 for size in config['sizes'])
              assert config['concurrency'] and all(type(size) is int and size > 0 for size in config['concurrency'])
              assert type(config['rounds']) is int and config['rounds'] > 0
              expected = []
              for surface in config['surfaces']:
                  for size in config['sizes']:
                      expected.extend([
                          (surface, size, 'cold_unprepared_read', config['diagnostic_cold'], 1),
                          (surface, size, 'explicit_index_preparation', config['diagnostic_cold'], None),
                      ])
                      for diagnostic in ([False, True] if config['diagnostic_hot'] else [False]):
                          expected.extend((surface, size, 'hot_pages', diagnostic, count) for count in config['concurrency'])
              actual = [(row['surface'], row['rows'], row['phase'], row['diagnostic'], row.get('concurrency'))
                        for row in report['runs']]
              assert actual == expected, 'Missing, repeated, unknown, or misordered benchmark phase'
              for row in report['runs']:
                  assert row['content_read_attempts'] == {'generated_file_content_opens': 0, 'image_codec_calls': 0}
                  assert all(type(row[key]) in (int, float) and math.isfinite(row[key]) and row[key] >= 0
                             for key in ('wall_seconds', 'cpu_seconds'))
                  if row['phase'] == 'explicit_index_preparation':
                      # This phase is emitted only after the maintenance callable returns.
                      # Require its real measurement/storage schema and populated index;
                      # it deliberately has no HTTP 'correctness' or response-status field.
                      assert row['wall_seconds'] > 0 and row['storage_before']['total_bytes'] >= 0
                      assert row['storage']['total_bytes'] > 0
                      index = 'v2_image_history' if row['surface'] == 'v2' else 'v1_read_sources'
                      tables = [database['tables'][index] for database in row['storage']['databases']
                                if index in database['tables']]
                      assert len(tables) == 1 and tables[0]['rows'] >= row['rows'], 'Preparation index is incomplete'
                      assert row['rss_peak_bytes'] >= row['rss_before_bytes'] > 0
                      assert row['io_delta']['wchar'] >= 0
                      continue
                  assert row['correctness'] is True and row['mismatches'] == []
                  assert row['source_read_attempts'] == {'legacy_source_content_opens': 0, 'directory_scan_attempts': 0}
                  if row['phase'] == 'cold_unprepared_read':
                      assert row['expected_status'] == 503 and row['rounds'] == row['offered'] == 1
                      assert row['succeeded'] == 0 and row['failed'] == row['status_503'] == 1
                      assert len(row['failures']) == 1
                      assert row['failures'][0]['status'] == 503
                      assert row['failures'][0]['error_code'] == 'history_index_unavailable'
                      assert row['response_hashes'] == [] and row['process_cold_prepared_index'] is None
                      assert all(row['work_counts'].get(key, 0) == 0 for key in
                                 ('logical_file_bytes_read', 'directory_entries', 'filesystem_scandir_calls'))
                      assert all(row['application_work_counts'].get(key, 0) == 0 for key in
                                 ('authority_decodes', 'job_projection_outputs', 'source_rows',
                                  'page_decodes', 'filesystem_entries', 'dirty_keys', 'refreshed_outputs'))
                  else:
                      assert row['phase'] == 'hot_pages' and row['expected_status'] == 200
                      assert row['rounds'] == config['rounds']
                      assert row['offered'] == row['succeeded'] == config['rounds'] * row['concurrency']
                      assert row['failed'] == row['status_503'] == 0 and row['failures'] == []
                      assert row['response_hashes'] and row['process_cold_prepared_index']['correct'] is True

          report = json.load(open('/tmp/v1-lab-history-read.json'))
          assert report['configuration']['surfaces'] == ['v1', 'lab']
          validate_report(report)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v1-lab-history-read-${{ github.sha }}
          path: /tmp/v1-lab-history-read.json
          if-no-files-found: ignore
      - name: Check diff hygiene
        run: git diff --check

  v2-queue-retention:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: custom_media_agent_2_0
    env:
      CODEX_AUTH_FILE: /tmp/nonexistent-media-auth.json
      CLAUDE_SETTINGS_FILE: /tmp/nonexistent-media-claude.json
      OPENAI_API_KEY: ""
      ANTHROPIC_AUTH_TOKEN: ""
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install V2 test dependencies
        # V2 runs from its source root; its existing flat layout is not an
        # installable distribution. Read declared dependencies without editing
        # packaging metadata or accidentally packaging deploy/provider_data.
        run: |
          python - <<'PY'
          import subprocess
          import sys
          import tomllib
          with open("pyproject.toml", "rb") as source:
              project = tomllib.load(source)["project"]
          subprocess.check_call([
              sys.executable, "-m", "pip", "install",
              *project["dependencies"], *project["optional-dependencies"]["dev"],
          ])
          PY
          # Product-neutral transport is a separate distribution, not V1 source.
          python -m pip install --no-deps ../render_bridge_primary
      - name: Run the complete V2 suite with synthetic data and mock providers
        run: python -m pytest -q
      - name: Verify isolated V2 read matrix
        run: |
          python ../scripts/benchmark_history_reads.py --surfaces v2 --sizes 100,1000 --concurrency 2,4,8 --rounds 1 --output /tmp/v2-history-read.json
          python - <<'PY'
          import json
          import math


          def validate_report(report):
              assert report['source_unchanged_during_run'] is True
              assert report['checkout_default_storage_unchanged'] is True
              config = report['configuration']
              assert config['index_lifecycle'] == 'explicit' and config['skip_cold_probe'] is False
              assert config['surfaces'] and set(config['surfaces']) <= {'v1', 'lab', 'v2'}
              assert config['sizes'] and all(type(size) is int and size > 0 for size in config['sizes'])
              assert config['concurrency'] and all(type(size) is int and size > 0 for size in config['concurrency'])
              assert type(config['rounds']) is int and config['rounds'] > 0
              expected = []
              for surface in config['surfaces']:
                  for size in config['sizes']:
                      expected.extend([
                          (surface, size, 'cold_unprepared_read', config['diagnostic_cold'], 1),
                          (surface, size, 'explicit_index_preparation', config['diagnostic_cold'], None),
                      ])
                      for diagnostic in ([False, True] if config['diagnostic_hot'] else [False]):
                          expected.extend((surface, size, 'hot_pages', diagnostic, count) for count in config['concurrency'])
              actual = [(row['surface'], row['rows'], row['phase'], row['diagnostic'], row.get('concurrency'))
                        for row in report['runs']]
              assert actual == expected, 'Missing, repeated, unknown, or misordered benchmark phase'
              for row in report['runs']:
                  assert row['content_read_attempts'] == {'generated_file_content_opens': 0, 'image_codec_calls': 0}
                  assert all(type(row[key]) in (int, float) and math.isfinite(row[key]) and row[key] >= 0
                             for key in ('wall_seconds', 'cpu_seconds'))
                  if row['phase'] == 'explicit_index_preparation':
                      # This phase is emitted only after the maintenance callable returns.
                      # Require its real measurement/storage schema and populated index;
                      # it deliberately has no HTTP 'correctness' or response-status field.
                      assert row['wall_seconds'] > 0 and row['storage_before']['total_bytes'] >= 0
                      assert row['storage']['total_bytes'] > 0
                      index = 'v2_image_history' if row['surface'] == 'v2' else 'v1_read_sources'
                      tables = [database['tables'][index] for database in row['storage']['databases']
                                if index in database['tables']]
                      assert len(tables) == 1 and tables[0]['rows'] >= row['rows'], 'Preparation index is incomplete'
                      assert row['rss_peak_bytes'] >= row['rss_before_bytes'] > 0
                      assert row['io_delta']['wchar'] >= 0
                      continue
                  assert row['correctness'] is True and row['mismatches'] == []
                  assert row['source_read_attempts'] == {'legacy_source_content_opens': 0, 'directory_scan_attempts': 0}
                  if row['phase'] == 'cold_unprepared_read':
                      assert row['expected_status'] == 503 and row['rounds'] == row['offered'] == 1
                      assert row['succeeded'] == 0 and row['failed'] == row['status_503'] == 1
                      assert len(row['failures']) == 1
                      assert row['failures'][0]['status'] == 503
                      assert row['failures'][0]['error_code'] == 'history_index_unavailable'
                      assert row['response_hashes'] == [] and row['process_cold_prepared_index'] is None
                      assert all(row['work_counts'].get(key, 0) == 0 for key in
                                 ('logical_file_bytes_read', 'directory_entries', 'filesystem_scandir_calls'))
                      assert all(row['application_work_counts'].get(key, 0) == 0 for key in
                                 ('authority_decodes', 'job_projection_outputs', 'source_rows',
                                  'page_decodes', 'filesystem_entries', 'dirty_keys', 'refreshed_outputs'))
                  else:
                      assert row['phase'] == 'hot_pages' and row['expected_status'] == 200
                      assert row['rounds'] == config['rounds']
                      assert row['offered'] == row['succeeded'] == config['rounds'] * row['concurrency']
                      assert row['failed'] == row['status_503'] == 0 and row['failures'] == []
                      assert row['response_hashes'] and row['process_cold_prepared_index']['correct'] is True

          report = json.load(open('/tmp/v2-history-read.json'))
          assert report['configuration']['surfaces'] == ['v2']
          validate_report(report)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-history-read-${{ github.sha }}
          path: /tmp/v2-history-read.json
          if-no-files-found: ignore
