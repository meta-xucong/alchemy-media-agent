name: Capacity and retention regressions

on:
  pull_request:
    paths:
      - "src_skeleton/**"
      - "custom_media_agent_2_0/**"
      - "tests/**"
      - "docs/migrations/**"
      - ".github/workflows/capacity-retention-regressions.yml"
  push:
    branches: ["codex/durable-bounded-retention"]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Set before Python/native libraries initialize, not after an OCR session.
  ORT_DISABLE_TELEMETRY: "1"
  OPENAI_AGENTS_DISABLE_TRACING: "1"

concurrency:
  group: retention-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-source-fidelity:
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      PYTHONPATH: src_skeleton
      MEDIA_STORAGE_ROOT: ${{ github.workspace }}/.ci-media-source-fidelity
      CODEX_AUTH_FILE: /tmp/nonexistent-media-auth.json
      CLAUDE_SETTINGS_FILE: /tmp/nonexistent-media-claude.json
      MEDIA_AGENT_MODE: mock
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install source and migration contract test dependencies
        run: python -m pip install pytest pydantic==2.13.4 python-dotenv==1.2.2
      - name: Verify Windows source fidelity and LF versus CRLF invariance
        run: python -m pytest -q tests/test_pr28_migration_reconciliation.py

  v1-retention:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CODEX_AUTH_FILE: /tmp/nonexistent-media-auth.json
      CLAUDE_SETTINGS_FILE: /tmp/nonexistent-media-claude.json
      OPENAI_API_KEY: ""
      ANTHROPIC_AUTH_TOKEN: ""
      V3_LLM_BRAIN_REMOTE_ENABLED: "false"
      LLM_PROMPT_PLANNING_ENABLED: "false"
      MEDIA_AGENT_PERSIST_RUNTIME_SETTINGS: "false"
      MEDIA_AGENT_MODE: mock
      MOCK_IMAGE_PROVIDER_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install V1 test dependencies
        run: python -m pip install -e './src_skeleton[dev]'
      - name: Verify durable records, ownership, cancellation and Lab recovery
        run: >-
          python -m pytest -q
          tests/test_v1_persistent_retention.py
          tests/test_v1_history_retention_bounds.py
          tests/test_v1_favorites_retention.py
          tests/test_v1_favorites_migration_atomicity.py
          tests/test_v1_history_delete_atomicity.py
          tests/test_v1_idempotency_scope.py
          tests/test_v1_session_ownership.py
          tests/test_v1_sqlite_async_boundary.py
          tests/test_v1_sqlite_cancellation_capacity.py
          tests/test_lab_interrupted_recovery.py
          tests/test_lab_snapshot_concurrency.py
          tests/test_v1_event_stream_thread_handoff.py
          tests/test_pr28_migration_reconciliation.py
          tests/test_v1_history_strict_import.py
          tests/test_v1_import_error_api.py
      - name: Run the complete V1 API smoke file with mock providers
        run: python -m pytest -q tests/test_api_smoke.py
      - name: Check diff hygiene
        run: git diff --check

  v2-queue-retention:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: custom_media_agent_2_0
    env:
      CODEX_AUTH_FILE: /tmp/nonexistent-media-auth.json
      CLAUDE_SETTINGS_FILE: /tmp/nonexistent-media-claude.json
      OPENAI_API_KEY: ""
      ANTHROPIC_AUTH_TOKEN: ""
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install V2 test dependencies
        # V2 runs from its source root; its existing flat layout is not an
        # installable distribution. Read declared dependencies without editing
        # packaging metadata or accidentally packaging deploy/provider_data.
        run: |
          python - <<'PY'
          import subprocess
          import sys
          import tomllib
          with open("pyproject.toml", "rb") as source:
              project = tomllib.load(source)["project"]
          subprocess.check_call([
              sys.executable, "-m", "pip", "install",
              *project["dependencies"], *project["optional-dependencies"]["dev"],
          ])
          PY
      - name: Run the complete V2 suite with synthetic data and mock providers
        run: python -m pytest -q
