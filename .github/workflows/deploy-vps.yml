name: Deploy VPS (retired)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse the legacy in-place deployment path
        run: |
          echo "This workflow is retired and makes no VPS connection or changes." >&2
          echo "Use guarded-vps-candidate.yml, inspect its receipt, then guarded-vps-activate.yml." >&2
          exit 2
